<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>Trust boundaries: what each part of the pipeline can do</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#57606a"/>
    </marker>
    <style>
      .zone-untrusted { fill: #fff1f0; stroke: #cf222e; stroke-width: 1.5; stroke-dasharray: 6 4; }
      .zone-runner { fill: #f6f8fa; stroke: #57606a; stroke-width: 1.5; }
      .zone-agent { fill: #fbefff; stroke: #8250df; stroke-width: 2; }
      .box { fill: #ffffff; stroke: #d0d7de; stroke-width: 1.2; }
      .h { font-size: 15px; font-weight: 700; fill: #24292f; }
      .t { font-size: 13px; fill: #24292f; }
      .s { font-size: 12px; fill: #57606a; }
      .ok { font-size: 13px; fill: #1a7f37; }
      .no { font-size: 13px; fill: #cf222e; }
      .flow { stroke: #57606a; stroke-width: 1.6; fill: none; }
    </style>
  </defs>

  <rect width="1200" height="560" fill="#ffffff"/>
  <text x="40" y="44" font-size="22" font-weight="700" fill="#24292f">Trust boundaries</text>
  <text x="40" y="68" font-size="14" fill="#57606a">The agent decides; deterministic steps act. Text from outside the project never reaches the agent.</text>

  <!-- Untrusted input -->
  <rect class="zone-untrusted" x="40" y="96" width="250" height="420" rx="14"/>
  <text class="h" x="60" y="124">GitHub (input)</text>
  <rect class="box" x="60" y="142" width="210" height="78" rx="8"/>
  <text class="t" x="74" y="166">Comment commands</text>
  <text class="s" x="74" y="186">only from users with write</text>
  <text class="s" x="74" y="204">access (checked twice)</text>
  <rect class="box" x="60" y="236" width="210" height="78" rx="8"/>
  <text class="t" x="74" y="260">Comments by collaborators</text>
  <text class="s" x="74" y="280">passed to the agent</text>
  <text class="s" x="74" y="298">as the issue thread</text>
  <rect class="box" x="60" y="330" width="210" height="78" rx="8"/>
  <text class="t" x="74" y="354">Comments by anyone else</text>
  <text class="no" x="74" y="376">withheld from the agent</text>
  <text class="s" x="74" y="394">(prompt-injection defence)</text>
  <rect class="box" x="60" y="424" width="210" height="72" rx="8"/>
  <text class="t" x="74" y="448">Fork pull requests</text>
  <text class="no" x="74" y="470">never reviewed</text>

  <!-- Runner -->
  <rect class="zone-runner" x="330" y="96" width="830" height="420" rx="14"/>
  <text class="h" x="350" y="124">GitHub Actions runner (one job per stage)</text>

  <rect class="box" x="350" y="142" width="240" height="160" rx="8"/>
  <text class="t" x="364" y="166">Workflow steps (bash + jq)</text>
  <text class="ok" x="364" y="192">✓ gather context</text>
  <text class="ok" x="364" y="214">✓ run checks</text>
  <text class="ok" x="364" y="236">✓ commit; push only in publish</text>
  <text class="ok" x="364" y="258">✓ comment, status label</text>
  <text class="s" x="364" y="284">GITHUB_TOKEN, scoped per job; build: read-only</text>

  <rect class="box" x="350" y="318" width="240" height="178" rx="8"/>
  <text class="t" x="364" y="342">Kept from the agent</text>
  <text class="no" x="364" y="368">✗ GitHub API tools</text>
  <text class="no" x="364" y="390">✗ git push / remote</text>
  <text class="no" x="364" y="412">✗ network (curl, web)</text>
  <text class="no" x="364" y="434">✗ .github/ .claude/ pipeline/</text>
  <text class="no" x="364" y="456">✗ .env files</text>
  <text class="s" x="364" y="480">deny rules: pipeline/claude-settings.json</text>

  <!-- Agent sandbox -->
  <rect class="zone-agent" x="630" y="142" width="510" height="354" rx="12"/>
  <text class="h" x="650" y="168">Claude Code agent (claude-code-action@v1)</text>
  <text class="s" x="650" y="188">in: issue thread, code, CLAUDE.md, skill prompt · out: schema-checked JSON</text>

  <rect class="box" x="650" y="206" width="150" height="190" rx="8"/>
  <text class="t" x="664" y="230">Plan</text>
  <text class="ok" x="664" y="256">✓ Read</text>
  <text class="ok" x="664" y="278">✓ Glob · Grep</text>
  <text class="no" x="664" y="304">✗ Edit · Write</text>
  <text class="no" x="664" y="326">✗ Bash</text>
  <text class="s" x="664" y="380">60 turns · 30 min</text>

  <rect class="box" x="815" y="206" width="150" height="190" rx="8"/>
  <text class="t" x="829" y="230">Build</text>
  <text class="ok" x="829" y="256">✓ Read · Glob · Grep</text>
  <text class="ok" x="829" y="278">✓ Edit · Write</text>
  <text class="ok" x="829" y="300">✓ run-checks.sh</text>
  <text class="no" x="829" y="326">✗ any other</text>
  <text class="no" x="829" y="346">   command</text>
  <text class="s" x="829" y="380">200 turns · 120 min</text>

  <rect class="box" x="980" y="206" width="140" height="190" rx="8"/>
  <text class="t" x="994" y="230">Review ×4</text>
  <text class="ok" x="994" y="256">✓ Read</text>
  <text class="ok" x="994" y="278">✓ Glob · Grep</text>
  <text class="no" x="994" y="304">✗ Edit · Write</text>
  <text class="no" x="994" y="326">✗ Bash</text>
  <text class="s" x="994" y="352">PR code in pr/;</text>
  <text class="s" x="994" y="368">prompts from base</text>
  <text class="s" x="994" y="384">100 turns · 45 min</text>

  <rect class="box" x="650" y="412" width="470" height="66" rx="8"/>
  <text class="t" x="664" y="436">Structured output only</text>
  <text class="s" x="664" y="458">plan.schema.json · build-report.schema.json · review-findings.schema.json</text>

  <!-- Flows -->
  <path class="flow" d="M270,181 H348" marker-end="url(#arrow)"/>
  <path class="flow" d="M270,275 H348" marker-end="url(#arrow)"/>
  <path class="flow" d="M590,222 H628" marker-end="url(#arrow)"/>
  <path class="flow" d="M648,445 H610 V280 H592" marker-end="url(#arrow)"/>

  <text x="40" y="546" font-size="12" fill="#57606a">A human starts and approves the work and merges every change. The agent has no tool that writes to GitHub: every write is a workflow step.</text>
</svg>
