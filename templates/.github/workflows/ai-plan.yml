# Stage 1 — Plan.
# Trigger: add the `ai:plan` label to an issue, or comment `/plan` on it (to re-plan after answering questions).
# The agent reads the issue thread and the code, then the workflow posts its plan and questions on the issue.
# The agent can only read: no edits, no shell, no GitHub access.
name: AI Plan

on:
  issues:
    types: [labeled]
  issue_comment:
    types: [created]

concurrency:
  group: ai-plan-${{ github.event.issue.number }}
  cancel-in-progress: true

jobs:
  plan:
    if: >-
      !github.event.issue.pull_request && (
        (github.event_name == 'issues' && github.event.label.name == 'ai:plan') ||
        (github.event_name == 'issue_comment' && startsWith(github.event.comment.body, '/plan'))
      )
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      issues: write
      id-token: write
    # GH_TOKEN is given only to the steps that call GitHub, never to the agent's step.
    env:
      ISSUE_NUMBER: ${{ github.event.issue.number }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Check the requester may run the pipeline
        run: ./pipeline/scripts/require-write-access.sh
        env:
          GH_TOKEN: ${{ github.token }}
          ACTOR: ${{ github.actor }}
          PIPELINE_ALLOWED_USERS: ${{ vars.PIPELINE_ALLOWED_USERS }}

      - name: Gather the issue thread
        run: ./pipeline/scripts/gather-issue-context.sh
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Load the plan schema
        id: schema
        run: echo "json=$(jq -c . pipeline/schemas/plan.schema.json)" >> "$GITHUB_OUTPUT"

      - name: Plan
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          settings: pipeline/claude-settings.json
          prompt: /pipeline-plan
          claude_args: >-
            --max-turns 40
            --allowedTools "Read,Glob,Grep"
            --disallowedTools "Bash,Edit,Write,WebFetch,WebSearch,mcp__*"
            --json-schema '${{ steps.schema.outputs.json }}'

      - name: Post the plan
        run: ./pipeline/scripts/post-plan.sh
        env:
          GH_TOKEN: ${{ github.token }}
          PLAN_JSON: ${{ steps.claude.outputs.structured_output }}

      - name: Report a failure on the issue
        if: failure()
        run: ./pipeline/scripts/comment-failure.sh
        env:
          GH_TOKEN: ${{ github.token }}
          STAGE: plan
          NUMBER: ${{ github.event.issue.number }}
