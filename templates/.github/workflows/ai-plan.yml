# Stage 1 — Plan.
# Trigger: comment `/plan` on an issue. To answer the plan's questions or change the plan, reply in one comment that
# starts with `/plan`; a new `/plan` replaces a plan run still in progress.
# The agent reads the issue thread and the code, then the workflow posts its plan and questions on the issue.
# The agent can only read: no edits, no shell, no GitHub access.
name: AI Plan

on:
  issue_comment:
    types: [created]

# Only the stage's own command joins the issue's group; every other comment gets a throwaway group, so it can't cancel a
# plan in progress. (Groups are resolved before any job runs; the job then refuses anyone without write access.)
concurrency:
  group: >-
    ai-plan-${{ (!github.event.issue.pull_request && startsWith(github.event.comment.body, '/plan'))
    && github.event.issue.number || format('skip-{0}', github.run_id) }}
  cancel-in-progress: true

jobs:
  plan:
    if: "!github.event.issue.pull_request && startsWith(github.event.comment.body, '/plan')"
    runs-on: ubuntu-latest
    timeout-minutes: ${{ fromJSON(vars.PIPELINE_TIMEOUT_PLAN || '30') }}
    permissions:
      contents: read
      issues: write
    # GH_TOKEN is given only to the steps that call GitHub, never to the agent's step.
    env:
      ISSUE_NUMBER: ${{ github.event.issue.number }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Check the requester may run the pipeline
        id: gate
        run: ./pipeline/scripts/require-write-access.sh
        env:
          GH_TOKEN: ${{ github.token }}
          ACTOR: ${{ github.actor }}
          PIPELINE_ALLOWED_USERS: ${{ vars.PIPELINE_ALLOWED_USERS }}
          COMMAND: /plan
          COMMENT_BODY: ${{ github.event.comment.body }}

      - name: Say it started
        run: ./pipeline/scripts/post-started.sh
        env:
          GH_TOKEN: ${{ github.token }}
          STAGE: Plan
          NUMBER: ${{ github.event.issue.number }}

      - name: Gather the issue thread
        run: ./pipeline/scripts/gather-issue-context.sh
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Load the plan schema
        id: schema
        run: echo "json=$(jq -c . pipeline/schemas/plan.schema.json)" >> "$GITHUB_OUTPUT"

      - name: Plan
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ github.token }}  # the job's token; no Claude GitHub App token is minted
          classify_inline_comments: "false"  # the pipeline posts no inline comments; skip the action's step for them
          settings: pipeline/claude-settings.json
          prompt: /pipeline-plan
          claude_args: >-
            --model ${{ vars.PIPELINE_MODEL_PLAN || 'claude-opus-5-5' }}
            --max-turns ${{ vars.PIPELINE_MAX_TURNS_PLAN || '60' }}
            --allowedTools "Read,Glob,Grep"
            --disallowedTools "Bash,Edit,Write,WebFetch,WebSearch,mcp__*"
            --json-schema '${{ steps.schema.outputs.json }}'

      - name: Post the plan
        run: ./pipeline/scripts/post-plan.sh
        env:
          GH_TOKEN: ${{ github.token }}
          PLAN_JSON: ${{ steps.claude.outputs.structured_output }}

      # Not when the requester was refused, and not when a newer /plan or /cancel stopped this run.
      - name: Report a failure on the issue
        if: failure() && steps.gate.outcome == 'success'
        run: ./pipeline/scripts/comment-failure.sh
        env:
          GH_TOKEN: ${{ github.token }}
          STAGE: plan
          NUMBER: ${{ github.event.issue.number }}

  # A job stopped at its time limit ends as "cancelled", and its own failure step doesn't run: report that here.
  # (A /cancel or a newer /plan cancels the whole run, so this stays quiet then.)
  timed-out:
    needs: plan
    if: always() && !cancelled() && needs.plan.result == 'cancelled'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Report the time limit
        run: |
          echo "The plan job stopped at its time limit. Raise PIPELINE_TIMEOUT_PLAN, or narrow the request." > "$RUNNER_TEMP/failure-reason"
          ./pipeline/scripts/comment-failure.sh
        env:
          GH_TOKEN: ${{ github.token }}
          STAGE: plan
          NUMBER: ${{ github.event.issue.number }}
