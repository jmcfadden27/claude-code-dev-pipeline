# Cancel a running stage: comment `/cancel` on the issue (stops its plan or build) or on the pull request (stops its
# fix or review). The agent's work is pushed only by the build workflow's last jobs, so a cancel during the agent pushes
# nothing; a cancel that lands while it publishes may leave the branch or pull request it was creating.
#
# How: each stage runs in a concurrency group named after its issue / pull request (ai-plan-N, ai-build-N,
# ai-review-N). A job that joins those groups with cancel-in-progress: true cancels the run in them.
name: AI Cancel

on:
  issue_comment:
    types: [created]

jobs:
  # The gate checks write access through the API; the cancel jobs run only after it succeeds.
  gate:
    if: startsWith(github.event.comment.body, '/cancel')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Check the requester may run the pipeline
        run: ./pipeline/scripts/require-write-access.sh
        env:
          GH_TOKEN: ${{ github.token }}
          ACTOR: ${{ github.actor }}
          PIPELINE_ALLOWED_USERS: ${{ vars.PIPELINE_ALLOWED_USERS }}
          COMMAND: /cancel
          COMMENT_BODY: ${{ github.event.comment.body }}

      - name: Acknowledge
        env:
          GH_TOKEN: ${{ github.token }}
          NUMBER: ${{ github.event.issue.number }}
        run: |
          gh issue comment "$NUMBER" --repo "$GITHUB_REPOSITORY" --body "<!-- ai-pipeline:cancelled -->
          ⏹ Cancelling any running plan, build, fix or review here."

  cancel-plan:
    needs: gate
    if: startsWith(github.event.comment.body, '/cancel')
    runs-on: ubuntu-latest
    timeout-minutes: 1
    permissions: {}
    concurrency:
      group: ai-plan-${{ github.event.issue.number }}
      cancel-in-progress: true
    steps:
      - run: echo "Cancelled the plan run for #${{ github.event.issue.number }}, if any."

  cancel-build:
    needs: gate
    if: startsWith(github.event.comment.body, '/cancel')
    runs-on: ubuntu-latest
    timeout-minutes: 1
    permissions: {}
    concurrency:
      group: ai-build-${{ github.event.issue.number }}
      cancel-in-progress: true
    steps:
      - run: echo "Cancelled the build / fix run for #${{ github.event.issue.number }}, if any."

  cancel-review:
    needs: gate
    if: startsWith(github.event.comment.body, '/cancel')
    runs-on: ubuntu-latest
    timeout-minutes: 1
    permissions: {}
    concurrency:
      group: ai-review-${{ github.event.issue.number }}
      cancel-in-progress: true
    steps:
      - run: echo "Cancelled the review run for #${{ github.event.issue.number }}, if any."
