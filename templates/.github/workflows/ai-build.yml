# Stage 2 — Build, and Fix.
#
# Build: add the `ai:approved` label to an issue that has a plan, or comment `/approve` on it. The agent implements the
#   approved plan; the workflow runs the checks again itself, commits, pushes a new branch and opens a pull request.
# Fix:   comment `/fix` on a pipeline pull request, optionally followed by what to change. The workflow brings the
#   branch up to date with its base, the agent resolves any conflicts and fixes the review's findings and your
#   comments, the workflow runs the checks again and pushes to the same pull request.
# Either way the review stage then runs on the pull request.
#
# The agent edits files and may run only ./pipeline/scripts/run-checks.sh: no git, no GitHub, no network.
#
# Two jobs keep write access away from anything the agent touched: `build` (read-only repository access) runs the
# agent and the checks and commits locally; `publish`, a fresh runner with write access, pushes the bundled commits and
# opens or comments on the pull request. Code that runs in `build` (tests the agent wrote included) never shares a
# runner with a token that can push.
name: AI Build

on:
  issues:
    types: [labeled]
  issue_comment:
    types: [created]

# One build or fix at a time per issue / pull request. `/cancel` stops a running one (ai-cancel.yml).
# Only the stage's own commands join the issue's / pull request's group; every other comment gets a throwaway group, so
# it can't queue behind or replace a build. (Groups are resolved before any job runs, so this can't check who wrote
# the comment; the job then refuses anyone without write access.)
concurrency:
  group: >-
    ai-build-${{ (
    (github.event_name == 'issues' && github.event.label.name == 'ai:approved' && !github.event.issue.pull_request) ||
    (github.event_name == 'issue_comment' && (
    (!github.event.issue.pull_request && startsWith(github.event.comment.body, '/approve')) ||
    (github.event.issue.pull_request && startsWith(github.event.comment.body, '/fix'))))
    ) && github.event.issue.number || format('skip-{0}', github.run_id) }}
  cancel-in-progress: false

jobs:
  build:
    if: >-
      (github.event_name == 'issues' && github.event.label.name == 'ai:approved' && !github.event.issue.pull_request) ||
      (github.event_name == 'issue_comment' && !github.event.issue.pull_request && startsWith(github.event.comment.body, '/approve')) ||
      (github.event_name == 'issue_comment' && github.event.issue.pull_request && startsWith(github.event.comment.body, '/fix'))
    runs-on: ubuntu-latest
    timeout-minutes: ${{ fromJSON(vars.PIPELINE_TIMEOUT_BUILD || '120') }}
    outputs:
      mode: ${{ steps.target.outputs.mode }}
    permissions:
      contents: read        # no pushing from this job
      pull-requests: write  # the "started" / failure comments
      issues: write
      id-token: write       # claude-code-action (and OIDC to your cloud, if your toolchain uses it)
    # GH_TOKEN is given only to the steps that post comments, never to the agent's step or the checks it runs, and the
    # checkouts keep no git credentials.
    env:
      NUMBER: ${{ github.event.issue.number }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Check the requester may run the pipeline
        id: gate
        run: ./pipeline/scripts/require-write-access.sh
        env:
          GH_TOKEN: ${{ github.token }}
          ACTOR: ${{ github.actor }}
          PIPELINE_ALLOWED_USERS: ${{ vars.PIPELINE_ALLOWED_USERS }}

      # The pipeline's own scripts and settings always come from the default branch, never from a pull request's
      # branch (which may be older, or changed). Only run-checks.sh, the project's own checks, runs from the code.
      - name: Keep the pipeline's files from the default branch
        run: mkdir -p "$RUNNER_TEMP/base" && cp -r pipeline "$RUNNER_TEMP/base/"

      - name: Work out what to do
        id: target
        env:
          GH_TOKEN: ${{ github.token }}
          IS_PR: ${{ github.event.issue.pull_request != null }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [[ "$IS_PR" == "true" ]]; then
            pr="$(gh pr view "$NUMBER" --repo "$GITHUB_REPOSITORY" \
              --json number,headRefName,baseRefName,isCrossRepository,closingIssuesReferences)"
            if [[ "$(jq -r .isCrossRepository <<< "$pr")" == "true" ]]; then
              echo "::error::Pull requests from forks are not changed by the pipeline."
              exit 1
            fi
            {
              echo "mode=fix"
              echo "pr=$NUMBER"
              echo "ref=$(jq -r .headRefName <<< "$pr")"
              echo "base=$(jq -r .baseRefName <<< "$pr")"
              echo "issue=$(jq -r '.closingIssuesReferences[0].number // empty' <<< "$pr")"
            } >> "$GITHUB_OUTPUT"
          else
            gh issue view "$NUMBER" --repo "$GITHUB_REPOSITORY" --json comments \
              --jq '[.comments[] | select(.body | startswith("<!-- ai-pipeline:plan -->"))] | length' \
              | grep -qv '^0$' || { echo "::error::No plan on this issue yet. Add the ai:plan label first."; exit 1; }
            { echo "mode=build"; echo "ref=$DEFAULT_BRANCH"; echo "base=$DEFAULT_BRANCH"; echo "issue=$NUMBER"; } >> "$GITHUB_OUTPUT"
          fi

      - name: Say it started
        run: "$RUNNER_TEMP/base/pipeline/scripts/post-started.sh"
        env:
          GH_TOKEN: ${{ github.token }}
          STAGE: ${{ steps.target.outputs.mode == 'fix' && 'Fix' || 'Build' }}

      # The code to work on: the default branch for a build, the pull request's branch for a fix.
      - uses: actions/checkout@v6
        with:
          ref: ${{ steps.target.outputs.ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Gather the context
        env:
          GH_TOKEN: ${{ github.token }}
          MODE: ${{ steps.target.outputs.mode }}
          ISSUE_NUMBER: ${{ steps.target.outputs.issue }}
          PR_NUMBER: ${{ steps.target.outputs.pr }}
          BASE_REF: ${{ steps.target.outputs.base }}
        run: |
          mkdir -p .pipeline
          echo ".pipeline/" >> .git/info/exclude
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          scripts="$RUNNER_TEMP/base/pipeline/scripts"
          if [[ -n "$ISSUE_NUMBER" ]]; then "$scripts/gather-issue-context.sh"; fi
          if [[ "$MODE" == "fix" ]]; then
            "$scripts/merge-base.sh"
            "$scripts/gather-pr-context.sh"
            git diff "origin/${BASE_REF}...HEAD" > .pipeline/diff.patch
            # claude-code-action replaces these files with the default branch's copies on pull request events; keep the
            # branch's own (after the merge) so the fix commit never reverts them (commit-change.sh puts them back).
            "$scripts/snapshot-config.sh" save
          fi

      # ── Your toolchain ──────────────────────────────────────────────────────────────────────────
      # Install what pipeline/scripts/run-checks.sh needs. For private package feeds or cloud credentials, see
      # docs/setup.md "Private packages and cloud credentials". For example:
      #   - uses: actions/setup-node@v4
      #     with: { node-version: 22, cache: npm }
      #   - uses: actions/setup-dotnet@v4
      #     with: { dotnet-version: 8.0.x }
      #   - uses: actions/setup-java@v4
      #     with: { distribution: temurin, java-version: 17 }

      - name: Load the report schema
        id: schema
        run: echo "json=$(jq -c . "$RUNNER_TEMP/base/pipeline/schemas/build-report.schema.json")" >> "$GITHUB_OUTPUT"

      - name: Build or fix
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          settings: ${{ runner.temp }}/base/pipeline/claude-settings.json
          prompt: ${{ steps.target.outputs.mode == 'fix' && '/pipeline-fix' || '/pipeline-build' }}
          claude_args: >-
            --model ${{ vars.PIPELINE_MODEL_BUILD || 'claude-opus-5-5' }}
            --max-turns ${{ vars.PIPELINE_MAX_TURNS_BUILD || '200' }}
            --allowedTools "Read,Glob,Grep,Edit,Write,Bash(./pipeline/scripts/run-checks.sh)"
            --disallowedTools "WebFetch,WebSearch,mcp__*"
            --json-schema '${{ steps.schema.outputs.json }}'

      # Trust, but verify: the agent's report says the checks passed; the pipeline checks for itself.
      - name: Run the checks again
        run: ./pipeline/scripts/run-checks.sh

      - name: Commit the change for publishing
        run: "$RUNNER_TEMP/base/pipeline/scripts/commit-change.sh"
        env:
          OUT: ${{ runner.temp }}/out
          MODE: ${{ steps.target.outputs.mode }}
          ISSUE_NUMBER: ${{ steps.target.outputs.issue }}
          PR_NUMBER: ${{ steps.target.outputs.pr }}
          HEAD_REF: ${{ steps.target.outputs.ref }}
          BASE_REF: ${{ steps.target.outputs.base }}
          REPORT_JSON: ${{ steps.claude.outputs.structured_output }}

      - uses: actions/upload-artifact@v4
        with:
          name: pipeline-change
          path: ${{ runner.temp }}/out/
          retention-days: 3
          overwrite: true

      # Not when the requester was refused (a stranger's command gets no reply), and not when /cancel stopped the run
      # (ai-cancel.yml says so).
      - name: Report a failure
        if: failure() && steps.gate.outcome == 'success'
        run: |
          "$RUNNER_TEMP/base/pipeline/scripts/comment-failure.sh"
        env:
          GH_TOKEN: ${{ github.token }}
          STAGE: ${{ steps.target.outputs.mode == 'fix' && 'fix' || 'build' }}
          REPORT_JSON: ${{ steps.claude.outputs.structured_output }}

  # The only job that can push. A fresh runner: it reads the build job's bundle and report, and runs scripts from its
  # own checkout of the default branch.
  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      pr: ${{ steps.publish.outputs.pr }}
      sha: ${{ steps.publish.outputs.sha }}
    permissions:
      contents: write
      pull-requests: write
      issues: write
    env:
      NUMBER: ${{ github.event.issue.number }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/download-artifact@v4
        with:
          name: pipeline-change
          path: ${{ runner.temp }}/in

      - name: Push and open or update the pull request
        id: publish
        run: ./pipeline/scripts/publish.sh
        env:
          GH_TOKEN: ${{ github.token }}
          IN: ${{ runner.temp }}/in

      - name: Report a failure
        if: failure()
        run: ./pipeline/scripts/comment-failure.sh
        env:
          GH_TOKEN: ${{ github.token }}
          STAGE: ${{ needs.build.outputs.mode == 'fix' && 'fix (publish)' || 'build (publish)' }}

  # Review the pull request straight away (stage 3). Calling the workflow directly is needed because a pull request
  # opened or pushed with the workflow token doesn't start other workflows by itself.
  review:
    needs: publish
    if: needs.publish.outputs.pr != ''
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
    uses: ./.github/workflows/ai-review.yml
    with:
      pr: ${{ needs.publish.outputs.pr }}
      sha: ${{ needs.publish.outputs.sha }}
    secrets: inherit
