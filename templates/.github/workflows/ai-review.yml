# Stage 3 — Review.
# Trigger: add the `ai:review` label to a pull request, or comment `/review` on it.
# Four independent reviewers run in parallel, one lens each (correctness, security, tests, requirements). None sees
# the others' findings. A final job merges their findings into one comment on the pull request. Advisory only:
# a person reviews and merges. Reviewers can only read.
name: AI Review

on:
  pull_request:
    types: [labeled]
  issue_comment:
    types: [created]

concurrency:
  group: ai-review-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: true

jobs:
  gate:
    if: >-
      (github.event_name == 'pull_request' && github.event.label.name == 'ai:review') ||
      (github.event_name == 'issue_comment' && github.event.issue.pull_request && startsWith(github.event.comment.body, '/review'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      pr: ${{ steps.pr.outputs.number }}
      head_sha: ${{ steps.pr.outputs.head_sha }}
      base_ref: ${{ steps.pr.outputs.base_ref }}
      issue: ${{ steps.pr.outputs.issue }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      # On pull_request events a plain checkout is the PR's merge commit; check out the base branch explicitly so the
      # pipeline's own scripts never come from the pull request.
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.base.ref || github.event.repository.default_branch }}
          fetch-depth: 1
          persist-credentials: false

      - name: Check the requester may run the pipeline
        run: ./pipeline/scripts/require-write-access.sh
        env:
          ACTOR: ${{ github.actor }}
          PIPELINE_ALLOWED_USERS: ${{ vars.PIPELINE_ALLOWED_USERS }}

      - name: Resolve the pull request (same repository only)
        id: pr
        env:
          NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}
        run: |
          pr="$(gh pr view "$NUMBER" --json number,headRefOid,baseRefName,isCrossRepository,closingIssuesReferences)"
          if [[ "$(jq -r .isCrossRepository <<< "$pr")" == "true" ]]; then
            echo "::error::Pull requests from forks are not reviewed by the pipeline."
            exit 1
          fi
          {
            echo "number=$(jq -r .number <<< "$pr")"
            echo "head_sha=$(jq -r .headRefOid <<< "$pr")"
            echo "base_ref=$(jq -r .baseRefName <<< "$pr")"
            echo "issue=$(jq -r '.closingIssuesReferences[0].number // empty' <<< "$pr")"
          } >> "$GITHUB_OUTPUT"

  review:
    # No GH_TOKEN in the job: only the context step calls GitHub.
    needs: gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        lens: [correctness, security, tests, requirements]
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write
    steps:
      # The base branch at the root: the review prompts, settings and scripts come from here, so a pull request can't
      # change how it is reviewed. The pull request's code goes in pr/, which the reviewers only read.
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.gate.outputs.base_ref }}
          fetch-depth: 1
          persist-credentials: false

      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.gate.outputs.head_sha }}
          path: pr
          fetch-depth: 0
          persist-credentials: false

      - name: Gather the diff and the issue
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_REF: ${{ needs.gate.outputs.base_ref }}
          ISSUE_NUMBER: ${{ needs.gate.outputs.issue }}
        run: |
          mkdir -p .pipeline
          git -C pr diff "origin/${BASE_REF}...HEAD" > .pipeline/diff.patch
          if [[ -n "$ISSUE_NUMBER" ]]; then ./pipeline/scripts/gather-issue-context.sh; fi

      - name: Load the findings schema
        id: schema
        run: echo "json=$(jq -c . pipeline/schemas/review-findings.schema.json)" >> "$GITHUB_OUTPUT"

      - name: Review (${{ matrix.lens }})
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          settings: pipeline/claude-settings.json
          prompt: /pipeline-review ${{ matrix.lens }}
          claude_args: >-
            --max-turns 40
            --allowedTools "Read,Glob,Grep"
            --disallowedTools "Bash,Edit,Write,WebFetch,WebSearch,mcp__*"
            --json-schema '${{ steps.schema.outputs.json }}'

      - name: Save the findings
        env:
          FINDINGS: ${{ steps.claude.outputs.structured_output }}
          LENS: ${{ matrix.lens }}
        run: |
          mkdir -p findings
          jq . <<< "$FINDINGS" > "findings/${LENS}.json"

      - uses: actions/upload-artifact@v4
        with:
          name: findings-${{ matrix.lens }}
          path: findings/

  summarize:
    needs: [gate, review]
    if: always() && needs.gate.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.gate.outputs.base_ref }}
          fetch-depth: 1
          persist-credentials: false

      - uses: actions/download-artifact@v4
        with:
          pattern: findings-*
          path: findings

      - name: Post one review comment
        run: ./pipeline/scripts/post-review.sh
        env:
          FINDINGS_DIR: findings
          PR_NUMBER: ${{ needs.gate.outputs.pr }}
          HEAD_SHA: ${{ needs.gate.outputs.head_sha }}

      - name: Report a failure on the pull request
        if: failure() || needs.review.result == 'failure'
        run: ./pipeline/scripts/comment-failure.sh
        env:
          STAGE: review
          NUMBER: ${{ needs.gate.outputs.pr }}
